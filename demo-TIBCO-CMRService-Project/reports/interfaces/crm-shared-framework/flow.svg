t text-anchor="middle" font-size="12.5" fill="#13203A"><title>Listener failure received — Sub: CRM Error Handler, called from listener Catch paths.</title><tspan x="694" y="48">Listener failure received</tspan></text><rect x="72" y="124" width="220" height="56" rx="4" fill="#F6F8FB" stroke="#B7791F" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Trace enabled? — eai:isTraceOn(&#39;CRMS-04020&#39;) in BW; process property in Boomi.</title><tspan x="182" y="156">Trace enabled?</tspan></text><rect x="328" y="124" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Call UCMAdapter request/reply — Timeout 5000 ms. BW: Common Sub_Requester over Rendezvous.</title><tspan x="438" y="148">Call UCMAdapter</tspan><tspan x="438" y="164">request/reply</tspan></text><rect x="584" y="124" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Send to exception queue — EMS queue %%Env%%.%%Common/ErrorHandling/ExceptionQueue%% (name and format not in export).</title><tspan x="694" y="156">Send to exception queue</tspan></text><rect x="72" y="232" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Log mail message — Common Sub_Trace with CRMS-04020.</title><tspan x="182" y="264">Log mail message</tspan></text><rect x="328" y="232" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Parse and validate reply — AddAccountReferenceResponse, validateOutput = true.</title><tspan x="438" y="264">Parse and validate reply</tspan></text><rect x="584" y="232" width="220" height="56" rx="28" fill="#F6F8FB" stroke="#0B7A73" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Failure recorded — Caller then acknowledges the JMS message.</title><tspan x="694" y="264">Failure recorded</tspan></text><rect x="72" y="340" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Send e-mail — Mail connector; recipients from CRT.</title><tspan x="182" y="372">Send e-mail</tspan></text><rect x="328" y="340" width="220" height="56" rx="4" fill="#F6F8FB" stroke="#B7791F" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>UCM status = 0? — STATUS_RESULT/@STATUS.</title><tspan x="438" y="372">UCM status = 0?</tspan></text><rect x="584" y="340" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#B4442A" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Raise transport/technical error — Requester error passed through unchanged (EAI-03004 on timeout); otherwise CRMS-03000.</title><tspan x="694" y="364">Raise transport/technical</tspan><tspan x="694" y="380">error</tspan></text><rect x="72" y="448" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#B4442A" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Mail failed - swallow — BW raises Error; all callers ignore it. In Boomi, Try/Catch inside the sub-process.</title><tspan x="182" y="480">Mail failed - swallow</tspan></text><rect x="328" y="448" width="220" height="56" rx="28" fill="#F6F8FB" stroke="#0B7A73" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Return response</title><tspan x="438" y="480">Return response</tspan></text><rect x="584" y="448" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#B4442A" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Raise CRMS-03021 — ApplicationError = STATUS_RESULT, Params = ERROR_DESCRIPTION.</title><tspan x="694" y="480">Raise CRMS-03021</tspan></text><rect x="328" y="556" width="220" height="56" rx="28" fill="#F6F8FB" stroke="#0B7A73" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Mail done</title><tspan x="438" y="588">Mail done</tspan></text></svg>